<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>
    
    <header>

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9TXs5QY9BzF4JX5vpjcpmI18I9Og0tX_CEXOty0v3PQ&s=10" alt="logo">

        <p>Akan Name Generator</p>

        <nav>

            <a href="#form">Generate</a>

            <a href="#history">History</a>

            <a href="#about">About</a>

        </nav>

    </header>

    <main>

        <section class="hero">

            <div class="description">

                <h1>
                    Discover your <span>Akan Name</span>

                </h1>

                <p>
                    Ever wondered what your Akan Name would be? Simply provide
                    your date of birth and gender, and let us reveal the traditional
                    Akan Name that matches the day you were born.

                </p>

            </div>

            <div class="hero-image">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRpLRv6uJp-NiIL73NXf--cKcGrl_36BdT7_T4qQhjf-A&s=10" alt="culture">

            </div>

        </section>

        <section id="generate">

            <h2>

                Generate Your Akan Name

            </h2>

            <form id="akan-form">

                <!-- DAY -->

                <label for="day">DAY</label>

                <input type="number" id="day" placeholder="Enter Day">

                <!-- MONTH -->

                <label for="month">MONTH</label>

                <input type="number" id="month" placeholder="Enter Month">

                <!-- YEAR -->

                <label for="year">YEAR</label>

                <input type="number" id="year" placeholder="Enter Year">

                <!-- GENDER -->

                <label for="gender">GENDER</label>

                <select id="gender">

                    <option value="">SELECT GENDER</option>

                    <option value="male">MALE</option>

                    <option value="female">FEMALE</option>

                </select>

                <!-- BUTTON -->

                <button type="submit">GENERATE NAME</button>

            </form>

        </section>

    </main>

</body>
</html>
